# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**.ts'
              - '**.tsx'
              - '**.js'
              - '**.jsx'
              - '**.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm lint:changed
          else
            pnpm lint
          fi

      - name: Check @auxx/lib exports are up to date
        run: pnpm -F @auxx/lib check:exports

      - name: Verify package exports resolve
        run: node scripts/ci/check-package-exports.js

  # A RATCHET, not a gate: lib and web carry thousands of pre-existing errors, so
  # this asserts only that a PR adds none. CI ran no typecheck at all until
  # 2026-07-30, when six TS2367s shipped a mail outage — see the script header.
  # One package per runner: each tsc peaks near 6GB and they must not share a box.
  typecheck:
    name: Typecheck (${{ matrix.package }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [lib, web]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A fresh checkout is COLD and `apps/web` cannot be typechecked in that
      # state. `@auxx/chat` resolves through `dist/`, and `next-env.d.ts` (which
      # declares `*.png` and friends) is gitignored and generated — so both are
      # present on a dev laptop and absent here. Without this step the ratchet
      # reports two phantom TS2307s that exist only in CI.
      #
      # This is not cosmetic. An unresolved module makes every import from it
      # `any`, which SUPPRESSES downstream errors — so a cold typecheck is more
      # permissive than a warm one and would let real breakage through. The
      # baseline is recorded warm; CI has to match.
      #
      # Targeted rather than `turbo build --filter=@auxx/web^...` to keep the job
      # short. If a NEW dist-consuming dependency is added to web, this step is
      # where to add it — the ratchet will name the unresolved file.
      - name: Prepare workspace for typecheck
        if: matrix.package == 'web'
        run: |
          pnpm --filter @auxx/chat build
          pnpm --filter @auxx/web exec next typegen

      - name: Typecheck ratchet
        env:
          # Under the ~7GB of a standard runner. Raising this above physical RAM
          # swaps instead of failing fast; move to a larger runner instead.
          TYPECHECK_HEAP_MB: 6144
        run: node scripts/ci/typecheck-ratchet.js --package ${{ matrix.package }}

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every vitest project that is currently 100% green, so none of them can
      # rot the way `lib` did — 49 failures accumulated there unnoticed because
      # only `billing` and `workflow-nodes` were ever run. The reason to
      # enumerate rather than run everything is that two projects cannot pass
      # here yet:
      #
      #   integration  (packages/test-utils) needs a live database
      #   database     sets no `name:` in its vitest.config.ts, so it is
      #                unreachable by `--project` and runs nowhere
      #
      # `--project='!lib'`-style negation is NOT a substitute: it selects the
      # `integration` project, which then fails on a missing database. Adding a
      # project here is the deliberate act that puts it under watch.
      #
      # `web` joined the list once its last 8 failing files were fixed — all of
      # them stale specs, mostly the permissions-v3 rename (`full`→`read`, and
      # `ResourcePermission` handed to a `Rung` slot). It is 150 files / 2437
      # tests and runs in ~25s, so it dominates this job's wall-clock.
      #
      # `lib` joined last: 506 files / 5764 tests, ~90s. Its 25 failures were
      # mostly import-time, not assertion drift — `vi.mock` factories that
      # replace a shared module wholesale (`@auxx/database`, `@auxx/logger`,
      # `drizzle-orm`) and then die when the import graph reaches an export they
      # did not list. `packages/lib/src/test/database-mock.ts` exists for that.
      # The 4 that report as SKIPPED here are the live-API provider suites,
      # gated on `describe.skipIf(!process.env.<VENDOR>_API_KEY)` — they are
      # meant never to run on a runner.
      - name: Run tests
        run: |
          npx vitest run \
            --project api \
            --project worker \
            --project kb \
            --project billing \
            --project services \
            --project workflow-nodes \
            --project credentials \
            --project redis \
            --project utils \
            --project ui \
            --project web \
            --project lib

  ci-ok:
    name: CI
    if: always()
    needs: [changes, lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      # `success` and `skipped` pass; EVERYTHING else fails. The earlier version
      # tested only for `failure`, which let `cancelled` through as green — and
      # that is not hypothetical. On 2026-07-30 a push superseded an in-flight
      # run, `Typecheck (web)` was cancelled mid-job, `ci-ok` reported success,
      # and a TS6307 that job would have caught sat on `main` until an unrelated
      # commit tripped it.
      #
      # A superseded run reporting failure is the correct reading: it verified
      # nothing. The run that replaced it is the one that speaks for the commit.
      - name: Check results
        run: |
          failed=0
          for job in changes lint typecheck test; do
            case "$job" in
              changes)   result="${{ needs.changes.result }}" ;;
              lint)      result="${{ needs.lint.result }}" ;;
              typecheck) result="${{ needs.typecheck.result }}" ;;
              test)      result="${{ needs.test.result }}" ;;
            esac
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::$job job did not pass (result: $result)"
              failed=1
            fi
          done
          if [[ "$failed" == "1" ]]; then
            exit 1
          fi
          echo "All checks passed or were skipped"
