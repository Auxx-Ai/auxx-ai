# .github/workflows/chat-publish.yml
name: Publish @auxx/chat

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
          - custom
      custom-version:
        description: "Custom version (only when bump = custom, e.g. 0.2.0-beta.1)"
        required: false
        type: string
      tag:
        description: "npm dist-tag"
        required: false
        type: choice
        default: latest
        options:
          - latest
          - beta
          - experimental
          - next
      dry-run:
        description: "Dry run (build + pack, skip publish)"
        required: false
        type: boolean
        default: false

concurrency:
  group: chat-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Preflight checks
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Chat publish must run from main branch, got ${{ github.ref }}"
            exit 1
          fi
          if [ "${{ inputs.bump }}" = "custom" ] && [ -z "${{ inputs.custom-version }}" ]; then
            echo "::error::custom-version is required when bump=custom"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          # Full history + tags so the post-publish release commit can rebase
          # onto the latest main before pushing, and so "Check tag availability"
          # sees remote tags (see "Commit version bump & tag").
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        working-directory: packages/chat
        run: |
          CURRENT=$(jq -r .version package.json)
          if [ "${{ inputs.bump }}" = "custom" ]; then
            NEW_VERSION="${{ inputs.custom-version }}"
          else
            NEW_VERSION=$(node -e "
              const [, M, m, p, pre, n] = '$CURRENT'.match(/^(\d+)\.(\d+)\.(\d+)(?:-(.+?)\.(\d+))?$/);
              const bump = '${{ inputs.bump }}', tag = '${{ inputs.tag }}';
              if (bump === 'major') console.log(+M+1+'.0.0');
              else if (bump === 'minor') console.log(M+'.'+(+m+1)+'.0');
              else if (bump === 'patch') console.log(pre ? M+'.'+m+'.'+p : M+'.'+m+'.'+(+p+1));
              else if (bump === 'prerelease') {
                if (pre === tag) console.log(M+'.'+m+'.'+p+'-'+tag+'.'+(+n+1));
                else console.log(M+'.'+m+'.'+(pre?p:+p+1)+'-'+tag+'.0');
              }
            ")
          fi
          if [ "$NEW_VERSION" = "$CURRENT" ]; then
            echo "::error::Version unchanged ($CURRENT). Nothing to publish."
            exit 1
          fi
          pnpm pkg set version="$NEW_VERSION"
          echo "CHAT_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "Bumped @auxx/chat: ${CURRENT} → ${NEW_VERSION}"

      - name: Build
        working-directory: packages/chat
        run: pnpm run build

      - name: Verify no workspace-only @auxx/* leaks into dist
        run: node scripts/ci/check-package-exports.js

      - name: Verify package contents
        working-directory: packages/chat
        run: pnpm pack

      # Publish the built widget bundle to the CDN (auxx-public S3, served by
      # cdn.auxx.ai). Runs before the npm publish so the CDN is current the
      # moment the version is public. The deploy role already grants s3:*.
      - name: Configure AWS credentials
        if: ${{ !inputs.dry-run }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::716542960845:role/AuxxGithubDeployRole
          aws-region: us-west-1

      - name: Upload widget bundle to CDN
        if: ${{ !inputs.dry-run }}
        env:
          BUCKET: auxx-public
          BUNDLE: packages/chat/dist/widget-bundle/auxx-chat.js
        run: |
          # Immutable, version-pinned artifact — safe to cache forever.
          aws s3 cp "$BUNDLE" "s3://$BUCKET/scripts/chat-widget-${CHAT_VERSION}.js" \
            --content-type 'application/javascript; charset=utf-8' \
            --cache-control 'public, max-age=31536000, immutable'
          # Stable alias the embed snippet points at — short TTL, purged below.
          aws s3 cp "$BUNDLE" "s3://$BUCKET/scripts/chat-widget.js" \
            --content-type 'application/javascript; charset=utf-8' \
            --cache-control 'public, max-age=300, stale-while-revalidate=86400'

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        working-directory: packages/chat
        run: pnpm publish --access public --tag ${{ inputs.tag }} --no-git-checks --provenance

      - name: Check tag availability
        if: ${{ !inputs.dry-run }}
        run: |
          if git rev-parse "chat-v${CHAT_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag chat-v${CHAT_VERSION} already exists"
            exit 1
          fi

      # npm has already published by this point (irreversible), so the release
      # commit + tag MUST land on main — otherwise main's package.json stays
      # behind npm and every future run re-bumps to the same taken version and
      # dies on "cannot publish over <version>". main may have advanced since
      # checkout, so rebase the one-line bump onto the latest main and push
      # tag + branch ATOMICALLY (never an orphaned tag), retrying on races.
      - name: Commit version bump & tag
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/chat/package.json
          git commit -m "chore(chat): release @auxx/chat@${CHAT_VERSION}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Cannot rebase the version bump onto main (conflict on package.json). Reconcile manually."
              exit 1
            fi
            git tag -f "chat-v${CHAT_VERSION}"
            if git push --atomic origin main "refs/tags/chat-v${CHAT_VERSION}"; then
              echo "Pushed release commit + tag chat-v${CHAT_VERSION} (attempt ${attempt})"
              exit 0
            fi
            echo "Push rejected (main moved); retrying (${attempt}/5)…"
            sleep 3
          done
          echo "::error::Failed to push release commit + tag after 5 attempts. npm has ${CHAT_VERSION} but main is behind — reconcile packages/chat/package.json to ${CHAT_VERSION} on main before the next run."
          exit 1

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        run: |
          gh release create "chat-v${CHAT_VERSION}" \
            --title "@auxx/chat v${CHAT_VERSION}" \
            --notes "Published \`@auxx/chat@${CHAT_VERSION}\` to npm with dist-tag \`${{ inputs.tag }}\`" \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Best-effort: the npm + CDN artifacts are already live by now, so a purge
      # failure must never fail the release. The Worker forces its own edge TTL,
      # so the stable alias needs purging to update promptly; the immutable
      # versioned URL is unaffected either way. Logs the CF response on failure.
      - name: Purge CDN edge cache for stable alias
        if: ${{ !inputs.dry-run }}
        continue-on-error: true
        run: |
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H 'Content-Type: application/json' \
            --data '{"files":["https://cdn.auxx.ai/scripts/chat-widget.js"]}') || true
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            || echo "::warning::Cloudflare purge did not succeed (see response above). Stable alias self-heals within the edge TTL; the immutable versioned URL is unaffected."
